<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat It ! - Ultimate Social</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --error-color: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.75rem;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .switch-mode {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
            cursor: pointer;
        }
        .switch-mode span {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            display: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sign Up Screen -->
    <div class="container" id="signup-container">
        <h1>Chat It !</h1>
        <h3 style="text-align: center; margin-top: 0; color: #94a3b8;">Create New Account</h3>
        
        <div class="form-group">
            <label for="su-email">Email Address</label>
            <input type="email" id="su-email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label for="su-password">Password</label>
            <input type="password" id="su-password" placeholder="••••••••">
        </div>
        
        <button id="signup-btn">Create Account & Launch</button>
        <div class="error-msg" id="signup-error"></div>

        <div class="switch-mode">
            Already have an account? <span id="to-login">Log In</span>
        </div>
    </div>

    <!-- Login Screen -->
    <div class="container hidden" id="login-container">
        <h1>Chat It !</h1>
        <h3 style="text-align: center; margin-top: 0; color: #94a3b8;">Log In</h3>
        
        <div class="form-group">
            <label for="li-email">Email Address or Username</label>
            <input type="text" id="li-email" placeholder="name@example.com or Username">
        </div>
        <div class="form-group">
            <label for="li-password">Password</label>
            <input type="password" id="li-password" placeholder="••••••••">
        </div>
        
        <button id="login-btn">Log In</button>
        <div class="error-msg" id="login-error">Account not available</div>

        <div class="switch-mode">
            Don't have an account? <span id="to-signup">Create Account</span>
        </div>
    </div>

    <!-- Main App Screen -->
    <div class="container hidden" id="app-container">
        <h1>Welcome, <span id="user-greeting"></span>!</h1>
        <p style="text-align: center; color: #94a3b8;">You are successfully logged in and connected to the multiverse.</p>
        <button id="logout-btn" style="background-color: #ef4444;">Log Out / Switch Account</button>
    </div>

    <script>
        const signupContainer = document.getElementById('signup-container');
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');

        const toLogin = document.getElementById('to-login');
        const toSignup = document.getElementById('to-signup');

        const signupBtn = document.getElementById('signup-btn');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        const suEmail = document.getElementById('su-email');
        const suPassword = document.getElementById('su-password');
        const liEmail = document.getElementById('li-email');
        const liPassword = document.getElementById('li-password');
        
        const signupError = document.getElementById('signup-error');
        const loginError = document.getElementById('login-error');
        const userGreeting = document.getElementById('user-greeting');

        // Check for active session
        const savedSession = localStorage.getItem('chat_it_user');
        if (savedSession) {
            const userData = JSON.parse(savedSession);
            userGreeting.textContent = userData.email;
            signupContainer.classList.add('hidden');
            loginContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        }

        // Toggle forms
        toLogin.addEventListener('click', () => {
            signupContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
            loginError.style.display = 'none';
        });

        toSignup.addEventListener('click', () => {
            loginContainer.classList.add('hidden');
            signupContainer.classList.remove('hidden');
            signupError.style.display = 'none';
        });

        // Sign Up Handler
        signupBtn.addEventListener('click', () => {
            const email = suEmail.value.trim();
            const password = suPassword.value.trim();

            if (!email || !password) {
                signupError.textContent = 'Please fill in email and password.';
                signupError.style.display = 'block';
                return;
            }

            const newUser = { email, password };
            localStorage.setItem('chat_it_registered_user', JSON.stringify(newUser));
            localStorage.setItem('chat_it_user', JSON.stringify(newUser));

            userGreeting.textContent = email;
            signupContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        });

        // Regular Login Handler with "Account not available" check
        loginBtn.addEventListener('click', () => {
            const identifier = liEmail.value.trim();
            const password = liPassword.value.trim();

            if (!identifier || !password) {
                loginError.textContent = 'Please enter your login details.';
                loginError.style.display = 'block';
                return;
            }

            const registeredData = localStorage.getItem('chat_it_registered_user');
            
            if (!registeredData) {
                loginError.textContent = 'Account not available';
                loginError.style.display = 'block';
                return;
            }

            const registeredUser = JSON.parse(registeredData);

            if (registeredUser.email === identifier && registeredUser.password === password) {
                localStorage.setItem('chat_it_user', JSON.stringify(registeredUser));
                userGreeting.textContent = registeredUser.email;
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
            } else {
                loginError.textContent = 'Account not available';
                loginError.style.display = 'block';
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_it_user');
            appContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
            liEmail.value = '';
            liPassword.value = '';
            loginError.style.display = 'none';
        });
    </script>
</body>
    
</html>
