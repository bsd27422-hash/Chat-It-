<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat It ! - Ultimate Social</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --google-color: #ea4335;
            --google-hover: #d33828;
            --error-color: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.75rem;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .google-btn {
            background-color: var(--google-color);
        }
        .google-btn:hover {
            background-color: var(--google-hover);
        }
        .switch-mode {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
            cursor: pointer;
        }
        .switch-mode span {
            color: var(--accent-color);
            text-decoration: underline;
        }
        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            display: none;
        }
        .hidden {
            display: none;
        }
        .divider {
            text-align: center;
            margin: 1rem 0;
            color: #64748b;
            font-size: 0.85rem;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: var(--border-color);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
    </style>
</head>
<body>

    <!-- Sign Up Screen -->
    <div class="container" id="signup-container">
        <h1>Chat It !</h1>
        <h3 style="text-align: center; margin-top: 0; color: #94a3b8;">Create New Account</h3>
        
        <div class="form-group">
            <label for="su-email">Email Address</label>
            <input type="email" id="su-email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label for="su-password">Password</label>
            <input type="password" id="su-password" placeholder="••••••••">
        </div>
        
        <button id="signup-btn">Create Account & Launch</button>
        <div class="error-msg" id="signup-error"></div>
        
        <div class="divider">OR</div>
        
        <button class="google-btn" id="google-signup-btn">Continue with Google</button>

        <div class="switch-mode">
            Already have an account? <span id="to-login">Log In</span>
        </div>
    </div>

    <!-- Login Screen -->
    <div class="container hidden" id="login-container">
        <h1>Chat It !</h1>
        <h3 style="text-align: center; margin-top: 0; color: #94a3b8;">Log In</h3>
        
        <div class="form-group">
            <label for="li-email">Email Address or Username</label>
            <input type="text" id="li-email" placeholder="name@example.com or Username">
        </div>
        <div class="form-group">
            <label for="li-password">Password</label>
            <input type="password" id="li-password" placeholder="••••••••">
        </div>
        
        <button id="login-btn">Log In</button>
        <div class="error-msg" id="login-error">Account not available</div>
        
        <div class="divider">OR</div>
        
        <button class="google-btn" id="google-login-btn">Log In with Google</button>

        <div class="switch-mode">
            Don't have an account? <span id="to-signup">Create Account</span>
        </div>
    </div>

    <!-- Main App Screen -->
    <div class="container hidden" id="app-container">
        <h1>Welcome, <span id="user-greeting"></span>!</h1>
        <p style="text-align: center; color: #94a3b8;">You are successfully logged in and connected to the multiverse.</p>
        <button id="logout-btn" style="background-color: #ef4444;">Log Out / Switch Account</button>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithRedirect, 
            getRedirectResult,
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Remember to replace with your actual Firebase configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const signupContainer = document.getElementById('signup-container');
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');

        const toLogin = document.getElementById('to-login');
        const toSignup = document.getElementById('to-signup');

        const signupBtn = document.getElementById('signup-btn');
        const loginBtn = document.getElementById('login-btn');
        const googleSignupBtn = document.getElementById('google-signup-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        const suEmail = document.getElementById('su-email');
        const suPassword = document.getElementById('su-password');
        const liEmail = document.getElementById('li-email');
        const liPassword = document.getElementById('li-password');
        
        const signupError = document.getElementById('signup-error');
        const loginError = document.getElementById('login-error');
        const userGreeting = document.getElementById('user-greeting');

        // Handle Google redirect result when user returns back to the page
        getRedirectResult(auth).catch((error) => {
            console.error("Google redirect error:", error.message);
        });

        // Monitor Auth state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userGreeting.textContent = user.displayName || user.email;
                signupContainer.classList.add('hidden');
                loginContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
            } else {
                appContainer.classList.add('hidden');
                signupContainer.classList.remove('hidden');
            }
        });

        toLogin.addEventListener('click', () => {
            signupContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
            loginError.style.display = 'none';
        });

        toSignup.addEventListener('click', () => {
            loginContainer.classList.add('hidden');
            signupContainer.classList.remove('hidden');
            signupError.style.display = 'none';
        });

        signupBtn.addEventListener('click', async () => {
            const email = suEmail.value.trim();
            const password = suPassword.value.trim();

            if (!email || !password) {
                signupError.textContent = 'Please fill in email and password.';
                signupError.style.display = 'block';
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                signupError.textContent = error.message;
                signupError.style.display = 'block';
            }
        });

        loginBtn.addEventListener('click', async () => {
            const identifier = liEmail.value.trim();
            const password = liPassword.value.trim();

            if (!identifier || !password) {
                loginError.textContent = 'Please enter your login details.';
                loginError.style.display = 'block';
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, identifier, password);
            } catch (error) {
                loginError.textContent = 'Account not available';
                loginError.style.display = 'block';
            }
        });

        // Use Redirect instead of Popup for mobile browser stability
        const handleGoogleAuth = async () => {
            try {
                await signInWithRedirect(auth, googleProvider);
            } catch (error) {
                alert('Google Sign-In failed: ' + error.message);
            }
        };

        googleSignupBtn.addEventListener('click', handleGoogleAuth);
        googleLoginBtn.addEventListener('click', handleGoogleAuth);

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });
    </script>
</body>
</html>
