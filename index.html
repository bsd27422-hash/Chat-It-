<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat It ! - Final Version</title>
    <style>
        :root {
            --accent-color: #ff3366;
            --card-bg: #000000;
            --text-color: #ffffff;
            --accent-hover: #e02e5b;
            --bg-color: #000000;
            --border-color: #222222;
            --sidebar-bg: #0a0a0a;
        }

        .light-theme {
            --accent-color: #ff3366;
            --card-bg: #ffffff;
            --text-color: #000000;
            --accent-hover: #e02e5b;
            --bg-color: #ffffff;
            --border-color: #e0e0e0;
            --sidebar-bg: #f5f5f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            opacity: 0.7;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .switch-text {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.7;
        }

        .switch-text a {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
        }

        .error-msg {
            color: #fa5252;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        #app-screen {
            display: none;
            width: 90vw;
            max-width: 850px;
            height: 85vh;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            overflow: hidden;
            flex-direction: row;
        }

        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-item:hover, .chat-item.active {
            background-color: rgba(255, 51, 102, 0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online { background-color: #40c057; }
        .status-dot.offline { background-color: #888888; }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
        }

        .chat-header-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 70%;
            word-break: break-word;
        }

        .message-bubble.user {
            background-color: var(--accent-color);
            color: white;
            border: none;
            align-self: flex-end;
        }

        .chat-input-bar {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: var(--sidebar-bg);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            width: auto;
            margin: 0;
            padding: 5px;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
    </div>

    <!-- Sign Up Screen (4 Fields) -->
    <div id="signup-screen" class="container">
        <h2>Chat It !<br><span style="font-size: 14px; opacity: 0.7;">Create Account</span></h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="signup-username" placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="signup-email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Verify Password</label>
            <input type="password" id="signup-verify-password" placeholder="••••••••">
            <div id="signup-error" class="error-msg">Passwords do not match or username taken!</div>
        </div>
        <button onclick="handleSignUp()">Create Account</button>
        <div class="switch-text">
            Already have an account? <a onclick="showScreen('login-screen')">Log In</a>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="container" style="display: none;">
        <h2>Chat It !<br><span style="font-size: 14px; opacity: 0.7;">Log In</span></h2>
        <div class="form-group">
            <label>Username or Email</label>
            <input type="text" id="login-user" placeholder="Username or Email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
            <div id="login-error" class="error-msg">Account not found or wrong password</div>
        </div>
        <button onclick="handleLogin()">Log In</button>
        <div class="switch-text">
            Don't have an account? <a onclick="showScreen('signup-screen')">Create Account</a>
        </div>
    </div>

    <!-- Main Chat App Interface -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 id="current-user-display">Chats</h3>
                <button class="icon-btn" onclick="openNewChatPrompt()" title="New Chat">+</button>
            </div>
            <div class="chat-list" id="chat-list"></div>
        </div>
        <div class="chat-main">
            <div class="chat-header-bar">
                <span id="active-chat-title" style="font-weight: bold;">Select a chat</span>
                <button class="icon-btn" onclick="handleLogout()" title="Log Out" style="font-size: 14px; color: #fa5252;">Log Out</button>
            </div>
            <div class="messages-container" id="messages-container">
                <div style="opacity: 0.6; text-align: center; margin-top: auto; margin-bottom: auto;">Select or start a new chat to begin messaging.</div>
            </div>
            <div class="chat-input-bar" id="chat-input-bar" style="display: none;">
                <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" style="width: auto; margin:0; padding: 0 20px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentChatUser = null;

        function showScreen(screenId) {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            
            if (screenId === 'app-screen') {
                document.getElementById('app-screen').style.display = 'flex';
            } else {
                document.getElementById(screenId).style.display = 'block';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function handleSignUp() {
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const verifyPassword = document.getElementById('signup-verify-password').value;
            const errorDiv = document.getElementById('signup-error');

            if (password !== verifyPassword || !username || !email || !password) {
                errorDiv.style.display = 'block';
                return;
            }

            let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');
            if (users[username]) {
                errorDiv.innerText = "Username already taken!";
                errorDiv.style.display = 'block';
                return;
            }

            users[username] = { email, password, online: true };
            localStorage.setItem('chat_all_users', JSON.stringify(users));

            currentUser = username;
            localStorage.setItem('chat_logged_user', currentUser);
            initApp();
        }

        function handleLogin() {
            const userInput = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');
            let foundUser = null;

            for (let uname in users) {
                if (uname === userInput || users[uname].email === userInput) {
                    if (users[uname].password === password) {
                        foundUser = uname;
                    }
                }
            }

            if (!foundUser) {
                errorDiv.style.display = 'block';
                return;
            }

            currentUser = foundUser;
            users[currentUser].online = true;
            localStorage.setItem('chat_all_users', JSON.stringify(users));
            localStorage.setItem('chat_logged_user', currentUser);
            initApp();
        }

        function handleLogout() {
            if (currentUser) {
                let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');
                if (users[currentUser]) {
                    users[currentUser].online = false;
                    localStorage.setItem('chat_all_users', JSON.stringify(users));
                }
            }
            localStorage.removeItem('chat_logged_user');
            currentUser = null;
            currentChatUser = null;
            showScreen('login-screen');
        }

        function initApp() {
            showScreen('app-screen');
            document.getElementById('current-user-display').innerText = currentUser;
            loadChatList();
        }

        function loadChatList() {
            const chatListEl = document.getElementById('chat-list');
            chatListEl.innerHTML = '';

            let chats = JSON.parse(localStorage.getItem(`chats_${currentUser}`) || '[]');
            let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');

            chats.forEach(username => {
                const isOnline = users[username] ? users[username].online : false;
                const item = document.createElement('div');
                item.className = `chat-item ${currentChatUser === username ? 'active' : ''}`;
                item.innerHTML = `
                    <span>${username}</span>
                    <span class="status-dot ${isOnline ? 'online' : 'offline'}" title="${isOnline ? 'Online' : 'Offline'}"></span>
                `;
                item.onclick = () => selectChat(username);
                chatListEl.appendChild(item);
            });
        }

        function openNewChatPrompt() {
            const username = prompt("Enter username to chat with:");
            if (!username) return;

            if (username === currentUser) {
                alert("You cannot chat with yourself!");
                return;
            }

            let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');
            if (!users[username]) {
                alert("Account not found in the app!");
                return;
            }

            let chats = JSON.parse(localStorage.getItem(`chats_${currentUser}`) || '[]');
            if (!chats.includes(username)) {
                chats.push(username);
                localStorage.setItem(`chats_${currentUser}`, JSON.stringify(chats));
            }

            loadChatList();
            selectChat(username);
        }

        function selectChat(username) {
            currentChatUser = username;
            document.getElementById('active-chat-title').innerText = username;
            document.getElementById('chat-input-bar').style.display = 'flex';
            loadMessages();
            loadChatList();
        }

        function loadMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            if (!currentChatUser) return;

            let allMessages = JSON.parse(localStorage.getItem('chat_messages_global') || '{}');
            let chatId = [currentUser, currentChatUser].sort().join('_');
            let messages = allMessages[chatId] || [];

            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `message-bubble ${msg.sender === currentUser ? 'user' : ''}`;
                bubble.innerText = msg.text;
                container.appendChild(bubble);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatUser) return;

            let allMessages = JSON.parse(localStorage.getItem('chat_messages_global') || '{}');
            let chatId = [currentUser, currentChatUser].sort().join('_');
            
            if (!allMessages[chatId]) {
                allMessages[chatId] = [];
            }

            allMessages[chatId].push({ sender: currentUser, text: text, timestamp: Date.now() });
            localStorage.setItem('chat_messages_global', JSON.stringify(allMessages));

            input.value = '';
            loadMessages();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        window.onload = () => {
            const savedUser = localStorage.getItem('chat_logged_user');
            if (savedUser) {
                let users = JSON.parse(localStorage.getItem('chat_all_users') || '{}');
                if (users[savedUser]) {
                    currentUser = savedUser;
                    users[savedUser].online = true;
                    localStorage.setItem('chat_all_users', JSON.stringify(users));
                    initApp();
                }
            }
        };
    </script>
</body>
</html>
