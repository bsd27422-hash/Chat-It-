<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat It ! - Ultimate Social</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="auth-container">
        <h1>Chat It !</h1>
        <div id="setup-screen">
            <div class="form-group">
                <label for="username">Username (Account ID)</label>
                <input type="text" id="username" placeholder="e.g. CyberNinja">
            </div>
            <div class="form-group">
                <label for="display-name">Display Name</label>
                <input type="text" id="display-name" placeholder="e.g. Alex ✨">
            </div>
            <div class="form-group">
                <label for="profile-pic">Profile Photo (Camera / Gallery)</label>
                <input type="file" id="profile-pic" accept="image/*">
            </div>
            <button id="launch-btn">Create Account & Launch App</button>
        </div>
    </div>

    <div class="container hidden" id="app-container">
        <h1>Welcome, <span id="user-greeting"></span>!</h1>
        <p style="text-align: center; color: #94a3b8;">You are now logged in and connected to the multiverse.</p>
        <button id="logout-btn" style="background-color: #ef4444;">Log Out / Switch Account</button>
    </div>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const usernameInput = document.getElementById('username');
        const displayNameInput = document.getElementById('display-name');
        const userGreeting = document.getElementById('user-greeting');

        // Check if user session already exists
        const savedUser = localStorage.getItem('chat_it_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            userGreeting.textContent = userData.displayName;
            authContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        }

        launchBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const displayName = displayNameInput.value.trim() || username;

            if (!username) {
                alert('Please enter a username to proceed.');
                return;
            }

            const userData = { username, displayName };
            localStorage.setItem('chat_it_user', JSON.stringify(userData));

            userGreeting.textContent = displayName;
            authContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_it_user');
            appContainer.classList.add('hidden');
            authContainer.classList.remove('hidden');
            usernameInput.value = '';
            displayNameInput.value = '';
        });
    </script>
</body>
</html>
