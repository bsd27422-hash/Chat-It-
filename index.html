<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat It ! - V6 (Updated)</title>
    <style>
        :root {
            --accent-color: #ff3366;
            --card-bg: #25262b;
            --text-color: #f8f9fa;
            --accent-hover: #e02e5b;
            --bg-color: #1a1b1e;
            --border-color: #343a40;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #adb5bd;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #141517;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .switch-text {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #adb5bd;
        }

        .switch-text a {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #fa5252;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        /* Chat Interface Styles */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 90vh;
            max-width: 600px;
            width: 100%;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .chat-messages {
            flex: 1;
            background-color: #141517;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background-color: #2b2c33;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }

        .message.user {
            background-color: var(--accent-color);
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            margin: 0;
        }

        .chat-input-area button {
            width: auto;
            margin: 0;
            padding: 0 20px;
        }

        .logout-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #adb5bd;
            padding: 6px 12px;
            width: auto;
            margin: 0;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #343a40;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Sign Up Screen -->
    <div id="signup-screen" class="container">
        <h2>Chat It !<br><span style="font-size: 15px; color: #adb5bd;">Create New Account (V6)</span></h2>
        <div class="form-group">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="signup-verify-password">Verify Password</label>
            <input type="password" id="signup-verify-password" placeholder="••••••••">
            <div id="signup-error" class="error-msg">Passwords do not match!</div>
        </div>
        <button onclick="handleSignUp()">Create Account & Launch</button>
        <div class="switch-text">
            Already have an account? <a onclick="showScreen('login-screen')">Log In</a>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="container" style="display: none;">
        <h2>Chat It !<br><span style="font-size: 15px; color: #adb5bd;">Log In</span></h2>
        <div class="form-group">
            <label for="login-user">Email Address or Username</label>
            <input type="text" id="login-user" placeholder="name@example.com or Username">
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
            <div id="login-error" class="error-msg">Account not available</div>
        </div>
        <button onclick="handleLogin()">Log In</button>
        <div class="switch-text">
            Don't have an account? <a onclick="showScreen('signup-screen')">Create Account</a>
        </div>
    </div>

    <!-- Chat Interface Screen -->
    <div id="chat-screen" class="container">
        <div class="chat-header">
            <h3 id="chat-username" style="margin: 0;">Chat Room</h3>
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>
        <div id="chat-messages" class="chat-messages">
            <div class="message">Welcome to Chat It ! Start messaging below.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById(screenId).style.display = 'flex';
        }

        function handleSignUp() {
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const verifyPassword = document.getElementById('signup-verify-password').value;
            const errorDiv = document.getElementById('signup-error');

            if (password !== verifyPassword) {
                errorDiv.style.display = 'block';
                return;
            }
            errorDiv.style.display = 'none';

            if (!username || !email || !password) {
                alert('Please fill in all fields');
                return;
            }

            const userData = { username, email, password };
            localStorage.setItem('chat_user', JSON.stringify(userData));
            
            launchChat(username);
        }

        function handleLogin() {
            const userInput = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            const savedData = localStorage.getItem('chat_user');
            if (!savedData) {
                errorDiv.style.display = 'block';
                return;
            }

            const user = JSON.parse(savedData);
            if ((userInput === user.email || userInput === user.username) && password === user.password) {
                errorDiv.style.display = 'none';
                launchChat(user.username);
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function launchChat(username) {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('chat-username').innerText = `Chat It ! (${username})`;
            
            document.getElementById('signup-username').value = '';
            document.getElementById('signup-email').value = '';
            document.getElementById('signup-password').value = '';
            document.getElementById('signup-verify-password').value = '';
            document.getElementById('login-user').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('signup-error').style.display = 'none';
            document.getElementById('login-error').style.display = 'none';
        }

        function handleLogout() {
            showScreen('login-screen');
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messagesDiv = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'message user';
            msgEl.innerText = text;
            messagesDiv.appendChild(msgEl);

            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
